version: '3.8'

services:

  api:
    build:
      context: ./backend/IT04.API
      dockerfile: Dockerfile
    container_name: it04_api
    ports:
      - "5195:8080"
    environment:
      - ASPNETCORE_URLS=http://+:8080

  frontend:
    build: ./frontend/it04-angular
    container_name: it04_frontend
    ports:
      - "4200:80"
    depends_on:
      - api
